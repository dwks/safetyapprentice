{#- 24px line icons, stroke inherits the theme accent via currentColor -#}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'globe' %}
  <circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>
{%- elif name == 'timeline' %}
  <path d="M2 12h20"/><circle cx="6.5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="17.5" cy="12" r="2"/>
{%- elif name == 'graph' %}
  <circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/>
  <path d="M7.2 6h9.6M6.1 8L10.9 16M17.9 8L13.1 16"/>
{%- elif name == 'trend-down' %}
  <path d="M22 17l-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/>
{%- elif name == 'cap' %}
  <path d="M12 4L2 9l10 5 10-5-10-5z"/><path d="M6 11.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"/>
{%- elif name == 'coins' %}
  <ellipse cx="12" cy="6.5" rx="8" ry="3"/>
  <path d="M4 6.5v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"/>
  <path d="M4 11.5v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"/>
{%- elif name == 'briefcase' %}
  <rect x="2" y="7" width="20" height="13" rx="2"/>
  <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M2 12h20"/>
{%- elif name == 'pin' %}
  <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>
{%- elif name == 'mic' %}
  <rect x="9" y="2" width="6" height="11" rx="3"/>
  <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"/>
{%- endif %}
</svg>
{%- endmacro %}
